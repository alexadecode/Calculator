<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Calculator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #eef2f8;
      font-family: Arial, sans-serif;
      color: #182230;
    }

    .calculator {
      width: min(340px, calc(100vw - 32px));
      padding: 22px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 16px 45px #18223020;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 22px;
    }

    #display {
      width: 100%;
      height: 72px;
      margin-bottom: 16px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #f3f6fb;
      color: #182230;
      font-size: 32px;
      text-align: right;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 58px;
      border: 0;
      border-radius: 13px;
      background: #edf1f7;
      color: #182230;
      font-size: 21px;
      cursor: pointer;
    }

    button:hover { background: #dfe6f0; }
    button:active { transform: scale(.97); }

    .operator { background: #e3ebff; color: #244ca3; }
    .clear { background: #ffe8e7; color: #a32d2a; }
    .equals { background: #3157a4; color: white; }
    .equals:hover { background: #244887; }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>My Calculator</h1>
    <input id="display" value="0" aria-label="Calculator display" readonly>

    <div class="buttons">
      <button class="clear" data-action="clear">C</button>
      <button data-action="backspace">⌫</button>
      <button class="operator" data-value="÷">÷</button>
      <button class="operator" data-value="×">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="−">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="equals" data-action="equals">=</button>

      <button data-action="sign">+/−</button>
      <button data-value="0">0</button>
      <button data-action="decimal">.</button>
      <button data-action="clear">C</button>
    </div>
  </main>

  <script>
    const display = document.querySelector("#display");
    let firstNumber = null;
    let operator = null;
    let startNewNumber = true;

    function show(value) {
      display.value = value;
    }

    function calculate() {
      const secondNumber = Number(display.value);
      let result;

      if (operator === "+") result = firstNumber + secondNumber;
      if (operator === "−") result = firstNumber - secondNumber;
      if (operator === "×") result = firstNumber * secondNumber;
      if (operator === "÷") {
        if (secondNumber === 0) {
          show("Can't divide by 0");
          firstNumber = null;
          operator = null;
          startNewNumber = true;
          return;
        }
        result = firstNumber / secondNumber;
      }

      show(String(Number(result.toPrecision(10))));
      firstNumber = null;
      operator = null;
      startNewNumber = true;
    }

    document.querySelector(".buttons").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const value = button.dataset.value;
      const action = button.dataset.action;

      if (value && "0123456789".includes(value)) {
        if (startNewNumber || display.value === "0" || display.value === "Can't divide by 0") {
          show(value);
          startNewNumber = false;
        } else {
          show(display.value + value);
        }
      }

      if (action === "decimal") {
        if (startNewNumber) {
          show("0.");
          startNewNumber = false;
        } else if (!display.value.includes(".")) {
          show(display.value + ".");
        }
      }

      if (value && ["+", "−", "×", "÷"].includes(value)) {
        firstNumber = Number(display.value);
        operator = value;
        startNewNumber = true;
      }

      if (action === "equals" && operator !== null) calculate();

      if (action === "clear") {
        show("0");
        firstNumber = null;
        operator = null;
        startNewNumber = true;
      }

      if (action === "backspace" && !startNewNumber) {
        show(display.value.length > 1 ? display.value.slice(0, -1) : "0");
      }

      if (action === "sign" && display.value !== "0") {
        show(String(Number(display.value) * -1));
      }
    });
  </script>
</body>
</html>
